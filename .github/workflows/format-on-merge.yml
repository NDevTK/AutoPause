name: Format on Merge

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  format:
    name: Apply Prettier Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push changes
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Run Prettier
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: |
          npx --yes prettier@3.10.1 . --write --single-quote --no-bracket-spacing --bracket-same-line --trailing-comma none --cache --cache-location=prettier_cache

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Prettier Bot"
          git config user.email "sync@corp.google.com"
          git add -A
          # Check if there are any changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "style: apply Prettier formatting"
            auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push
          fi
